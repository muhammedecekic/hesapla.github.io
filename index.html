<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesap Makinesi</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .calculator {
            background-color: #1e293b;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            padding: 24px;
            width: 320px;
        }
        .display {
            background-color: #0f172a;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 2.2rem;
            text-align: right;
            padding: 16px;
            margin-bottom: 20px;
            word-wrap: break-word;
            min-height: 70px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        button {
            background-color: #334155;
            border: none;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 1.25rem;
            font-weight: 600;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:hover {
            background-color: #475569;
        }
        button:active {
            transform: scale(0.95);
        }
        button.operator {
            background-color: #3b82f6;
        }
        button.operator:hover {
            background-color: #2563eb;
        }
        button.clear {
            background-color: #ef4444;
            grid-column: span 2;
        }
        button.clear:hover {
            background-color: #dc2626;
        }
        button.equal {
            background-color: #10b981;
            grid-column: span 2;
        }
        button.equal:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

<div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button class="operator" onclick="appendChar('/')">/</button>
        <button class="operator" onclick="appendChar('*')">*</button>
        
        <button onclick="appendChar('7')">7</button>
        <button onclick="appendChar('8')">8</button>
        <button onclick="appendChar('9')">9</button>
        <button class="operator" onclick="appendChar('-')">-</button>
        
        <button onclick="appendChar('4')">4</button>
        <button onclick="appendChar('5')">5</button>
        <button onclick="appendChar('6')">6</button>
        <button class="operator" onclick="appendChar('+')">+</button>
        
        <button onclick="appendChar('1')">1</button>
        <button onclick="appendChar('2')">2</button>
        <button onclick="appendChar('3')">3</button>
        <button onclick="appendChar('.')">.</button>
        
        <button onclick="appendChar('0')">0</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');

    function appendChar(char) {
        if (display.innerText === '0' && char !== '.') {
            display.innerText = char;
        } else {
            display.innerText += char;
        }
    }

    function clearDisplay() {
        display.innerText = '0';
    }

    function calculate() {
        try {
            display.innerText = eval(display.innerText);
        } catch (e) {
            display.innerText = 'Hata';
            setTimeout(() => clearDisplay(), 1500);
        }
    }
</script>

</body>
</html>
