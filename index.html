<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optik Dengeleme & Ayırıcı Hesaplayıcı</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            padding: 28px;
            width: 100%;
            max-width: 580px;
            border: 1px solid #334155;
        }
        h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            text-align: center;
            color: #38bdf8;
        }
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #94a3b8;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #38bdf8;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        button {
            width: 100%;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0369a1;
        }
        .result-box {
            margin-top: 24px;
            background-color: #0f172a;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid #334155;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #1e293b;
            font-size: 0.95rem;
        }
        .result-item:last-child {
            border-bottom: none;
        }
        .left-col {
            flex: 1.2;
        }
        .center-col {
            flex: 1;
            text-align: center;
            font-weight: 700;
            color: #38bdf8;
            font-size: 1.05rem;
        }
        .right-col {
            flex: 1;
            text-align: right;
            font-weight: 700;
            color: #f8fafc;
        }
        .sub-text {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 3px;
        }
        .status-badge {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .status-pass {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid #059669;
        }
        .status-fail {
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid #dc2626;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Optik Dengeleme & Ayırıcı Hesabı</h2>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="input-group">
            <label>Ana Giriş Gücü (mW)</label>
            <input type="number" id="inputPower" value="80" step="any">
        </div>
        <div class="input-group">
            <label>Test Gücü (mW)</label>
            <input type="number" id="testPower" value="20" step="any">
        </div>
    </div>

    <div class="input-group">
        <label>Birim Test Okumaları (µW)</label>
        <div class="grid-3">
            <input type="number" id="p1" value="400" step="any" placeholder="1. Birim">
            <input type="number" id="p2" value="415" step="any" placeholder="2. Birim">
            <input type="number" id="p3" value="450" step="any" placeholder="3. Birim">
        </div>
    </div>

    <button onclick="calculate()">Eşitleme Oranlarını Hesapla</button>

    <div class="result-box" id="results" style="display: none;">
        
        <!-- 1. KOL -->
        <div class="result-item">
            <div class="left-col">
                <div>1. Kol Ayırma Oranı</div>
                <div class="sub-text" id="pMw1">Giren Güç: - mW</div>
            </div>
            <div class="center-col" id="ratio1">-%</div>
            <div class="right-col" id="out1">- µW</div>
        </div>

        <!-- 2. KOL -->
        <div class="result-item">
            <div class="left-col">
                <div>2. Kol Ayırma Oranı</div>
                <div class="sub-text" id="pMw2">Giren Güç: - mW</div>
            </div>
            <div class="center-col" id="ratio2">-%</div>
            <div class="right-col" id="out2">- µW</div>
        </div>

        <!-- 3. KOL -->
        <div class="result-item">
            <div class="left-col">
                <div>3. Kol Ayırma Oranı</div>
                <div class="sub-text" id="pMw3">Giren Güç: - mW</div>
            </div>
            <div class="center-col" id="ratio3">-%</div>
            <div class="right-col" id="out3">- µW</div>
        </div>

        <!-- SON FARK -->
        <div class="result-item" style="margin-top: 10px; padding-top: 14px;">
            <span style="font-weight: 600;">Çıkışlar Arası Son Fark:</span>
            <strong id="diffVal" style="color: #38bdf8; font-size: 1.05rem;">- µW</strong>
        </div>

        <div id="statusBadge" class="status-badge"></div>
    </div>
</div>

<script>
    function calculate() {
        const mainMw = parseFloat(document.getElementById('inputPower').value);
        const testMw = parseFloat(document.getElementById('testPower').value);
        const p1 = parseFloat(document.getElementById('p1').value);
        const p2 = parseFloat(document.getElementById('p2').value);
        const p3 = parseFloat(document.getElementById('p3').value);

        if (isNaN(mainMw) || isNaN(testMw) || isNaN(p1) || isNaN(p2) || isNaN(p3) || mainMw <= 0 || testMw <= 0) {
            alert("Lütfen tüm alanlara geçerli pozitif değerler girin.");
            return;
        }

        // Her bir birimin 1 mW başına ürettiği hassasiyet/verim (µW / mW)
        const s1 = p1 / testMw;
        const s2 = p2 / testMw;
        const s3 = p3 / testMw;

        // Eşit çıkış elde etmek için gerekli güç ağırlıkları (Ters orantı)
        const w1 = 1 / s1;
        const w2 = 1 / s2;
        const w3 = 1 / s3;
        const totalW = w1 + w2 + w3;

        // % Ayırma oranları
        const ratio1 = (w1 / totalW) * 100;
        const ratio2 = (w2 / totalW) * 100;
        const ratio3 = (w3 / totalW) * 100;

        // Ana güç parçalandığında her bir kola giren bağımsız mW güçleri
        const branchMw1 = (mainMw * ratio1) / 100;
        const branchMw2 = (mainMw * ratio2) / 100;
        const branchMw3 = (mainMw * ratio3) / 100;

        // Her birimin kendi parçalanmış giren mW gücüyle üreteceği nihai çıkış (µW)
        const finalP1 = branchMw1 * s1;
        const finalP2 = branchMw2 * s2;
        const finalP3 = branchMw3 * s3;

        // Çıkışlar arası maks fark
        const minOut = Math.min(finalP1, finalP2, finalP3);
        const maxOut = Math.max(finalP1, finalP2, finalP3);
        const diff = maxOut - minOut;

        // Soldaki Her Kolun Kendi Giren Gücü (mW)
        document.getElementById('pMw1').innerText = "Kola Giren: " + branchMw1.toFixed(2) + " mW";
        document.getElementById('pMw2').innerText = "Kola Giren: " + branchMw2.toFixed(2) + " mW";
        document.getElementById('pMw3').innerText = "Kola Giren: " + branchMw3.toFixed(2) + " mW";

        // Ortadaki Yüzdelikler (%)
        document.getElementById('ratio1').innerText = "%" + ratio1.toFixed(2);
        document.getElementById('ratio2').innerText = "%" + ratio2.toFixed(2);
        document.getElementById('ratio3').innerText = "%" + ratio3.toFixed(2);

        // Sağdaki O Birimin Üreteceği Çıkış Gücü (µW)
        document.getElementById('out1').innerText = finalP1.toFixed(1) + " µW";
        document.getElementById('out2').innerText = finalP2.toFixed(1) + " µW";
        document.getElementById('out3').innerText = finalP3.toFixed(1) + " µW";

        // En alttaki fark
        document.getElementById('diffVal').innerText = diff.toFixed(1) + " µW";

        const badge = document.getElementById('statusBadge');

        if (diff <= 15) {
            badge.className = "status-badge status-pass";
            badge.innerHTML = `✓ TAM DENGELENDİ (Fark: ${diff.toFixed(1)} µW ≤ 15 µW)<br>Tüm birimlerin çıkış güçleri eşitlendi.`;
        } else {
            badge.className = "status-badge status-fail";
            badge.innerHTML = `✕ TOLERANS AŞILDI! (Fark: ${diff.toFixed(1)} µW > 15 µW)<br>Çıkışlar arasındaki fark 15 µW sınırını aşıyor.`;
        }

        document.getElementById('results').style.display = 'block';
    }
</script>

</body>
</html>
